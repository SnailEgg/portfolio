<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="author" content="Jordan Smith">
		<title>Donut Snail Gallery - Jordan Delta Smith</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
		<!-- Favicon -->
		<link rel="icon" type="image/x-icon" href="../../images/delta-snail-bg.ico">
		<!-- Stylesheets -->
		<link rel="stylesheet" type="text/css" href="../../css/styles.css">
		<link rel="stylesheet" type="text/css" href="../../css/portfolio.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Coral+Pixels&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
	</head>
	<body>
		<!-- HEADER -->
		<header class="fixed-top">
			<nav class="serif navbar navbar-expand-sm bg-body-tertiary" data-bs-theme="dark">
				<div class="container-fluid">
					<a class="navbar-brand" href="../../">Jordan Delta Smith</a>
					<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
						<span class="navbar-toggler-icon"></span>
					</button>
					<div class="collapse navbar-collapse justify-content-end" id="navbarNav">
						<ul class="navbar-nav">
							<li class="nav-item">
								<a class="nav-link" href="../../">Home</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="../../games">Games & Art</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="../../web">Web & Design</a>
							</li>
						</ul>
					</div>
				</div>
			</nav>
		</header>
		<!-- MAIN -->
		<main class="mt-5">
			<!-- TITLE -->
			<section class="bg-light min-vh-100 py-sm-3 py-md-4 py-lg-5">
                <div class="container container-md py-5">
                    <h1 class="serif text-center mt-3 mt-lg-0 mb-lg-4">Donut Snail Character (2025)</h1>
                    <div class="container-fluid pb-5">
						<div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3">
							<img type="button" class="btn col" data-bs-toggle="modal" data-bs-target="#detailFrontModal" src="images/detail_front.png" alt="Donut Snail front view" />
							<img type="button" class="btn col" data-bs-toggle="modal" data-bs-target="#detailBackModal" src="images/detail_back.png" alt="Donut Snail back view" />
							<img type="button" class="btn col" data-bs-toggle="modal" data-bs-target="#poseCannibalismModal" src="images/pose_cannibalism.png" alt="Donut Snail widening its eyes looking at a box of donuts" />
							<img type="button" class="btn col" data-bs-toggle="modal" data-bs-target="#poseDrinkModal" src="images/pose_drink.png" alt="Donut Snail hanging off a glass of milk" />
							<img type="button" class="btn col" data-bs-toggle="modal" data-bs-target="#wireFrontModal" src="images/wire_front.png" alt="Wireframe render of Donut Snail from the front" />
							<img type="button" class="btn col" data-bs-toggle="modal" data-bs-target="#wireSideModal" src="images/wire_side.png" alt="Wireframe render of Donut Snail from the side" />
						</div>
                    </div>
                </div>
				<div class="basic-frame frame-front frame-br"></div>
				<div class="basic-frame frame-back frame-bl"></div>
				<div class="basic-frame frame-front frame-tl"></div>
				<div class="basic-frame frame-back frame-tr"></div>
			</section>
			<!-- Modals -->
			<div class="modal fade" id="detailFrontModal" tabindex="-1" aria-labelledby="detailFrontModalLabel" aria-hidden="true">
				<div class="modal-dialog">
					<div class="modal-content">
						<img src="images/detail_front.png" id="detailFrontModalLabel" alt="Donut Snail front view" />
					</div>
				</div>
			</div>
			<div class="modal fade" id="detailBackModal" tabindex="-1" aria-labelledby="detailBackModalLabel" aria-hidden="true">
				<div class="modal-dialog">
					<div class="modal-content">
						<img src="images/detail_back.png" id="detailBackModalLabel" alt="Donut Snail back view" />
					</div>
				</div>
			</div>
			<div class="modal fade" id="poseCannibalismModal" tabindex="-1" aria-labelledby="poseCannibalismModalLabel" aria-hidden="true">
				<div class="modal-dialog">
					<div class="modal-content">
						<img src="images/pose_cannibalism.png" id="poseCannibalismModalLabel" alt="Donut Snail widening its eyes looking at a box of donuts" />
					</div>
				</div>
			</div>
			<div class="modal fade" id="poseDrinkModal" tabindex="-1" aria-labelledby="poseDrinkModalLabel" aria-hidden="true">
				<div class="modal-dialog">
					<div class="modal-content">
						<img src="images/pose_drink.png" id="poseDrinkModalLabel" alt="Donut Snail hanging off a glass of milk" />
					</div>
				</div>
			</div>
			<div class="modal fade" id="wireFrontModal" tabindex="-1" aria-labelledby="wireFrontModalLabel" aria-hidden="true">
				<div class="modal-dialog">
					<div class="modal-content">
						<img src="images/wire_front.png" id="wireFrontModalLabel" alt="Wireframe render of Donut Snail from the front" />
					</div>
				</div>
			</div>
			<div class="modal fade" id="wireSideModal" tabindex="-1" aria-labelledby="wireSideModalLabel" aria-hidden="true">
				<div class="modal-dialog">
					<div class="modal-content">
						<img src="images/wire_side.png" id="wireSideModalLabel" alt="Wireframe render of Donut Snail from the side" />
					</div>
				</div>
			</div>
		</main>
		<!-- FOOTER -->
		<footer class="serif container-fluid py-3">
			<div class="row">
				<!-- Copyright -->
				<p class="col-12 col-md-6 text-center text-md-start">Copyright &copy; Jordan Delta Smith 2026</p>
			</div>
		</footer>
		<script src="../includes/portfolio.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	</body>
</html>
